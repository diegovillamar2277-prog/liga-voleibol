<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#f59e0b">
  <meta name="description" content="Liga Voleibol — Gestión de ligas deportivas">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title>Liga Voleibol</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- Loading global -->
  <div id="global-loading" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1rem">
    <div class="spinner"></div>
    <p class="muted">Iniciando…</p>
  </div>

  <!-- Toast container (los toasts se insertan aquí por JS) -->

  <script type="module" src="/src/main.js"></script>

  <!-- Service Worker para PWA -->
  <script>
    // Desregistrar service worker para forzar carga fresca
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
  </script>
  <script>
  window.buscarLiga = async function() {
    const inp = document.getElementById('input-codigo');
    const err = document.getElementById('buscar-error');
    if (!inp) return;
    const codigo = inp.value.trim().toUpperCase();
    if (!codigo) {
      if (err) { err.textContent = 'Escribe el código'; err.style.display = 'block'; }
      return;
    }
    if (err) err.style.display = 'none';
    const btn = inp.nextElementSibling;
    if (btn) { btn.disabled = true; btn.textContent = 'Buscando…'; }
    // Redirigir a URL con código
    window.location.href = '/?liga=' + codigo;
  };
</script>
</body>
</html>
