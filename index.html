<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#f59e0b">
  <meta name="description" content="Liga Voleibol — Gestión de ligas deportivas">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title>Liga Voleibol</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- Loading global -->
  <div id="global-loading" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1rem">
    <div class="spinner"></div>
    <p class="muted">Iniciando…</p>
  </div>

  <script type="module" src="/src/main.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('[SW] Registrado:', reg.scope);
            // Verificar actualizaciones cada vez que la app se abre
            reg.update();
          })
          .catch(err => console.warn('[SW] Error al registrar:', err));
      });
    }
  </script>

  <!-- buscarLiga global (evita problemas de caché con módulos ES) -->
  <script>
    window.buscarLiga = async function() {
      const inp = document.getElementById('input-codigo');
      const err = document.getElementById('buscar-error');
      if (!inp) return;
      const codigo = inp.value.trim();
      if (!codigo) {
        if (err) { err.textContent = 'Escribe el código'; err.style.display = 'block'; }
        return;
      }
      if (err) err.style.display = 'none';
      const btn = inp.nextElementSibling;
      if (btn) { btn.disabled = true; btn.textContent = 'Buscando…'; }
      window.location.href = '/?liga=' + encodeURIComponent(codigo);
    };
  </script>
</body>
</html>
